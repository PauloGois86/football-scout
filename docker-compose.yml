services:

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: football-scout-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3500
      - DB_PATH=/data/football.db
    ports:
      - "3500:3500"
    volumes:
      - football_data:/data
    networks:
      - football-scout

  frontend:
    image: nginx:alpine
    container_name: football-scout-ui
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3501:80"
    depends_on:
      - api
    networks:
      - football-scout

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: football-scout-collector
    restart: "no"
    env_file: .env
    environment:
      - DB_PATH=/data/football.db
      - DELAY_MS=1200
    volumes:
      - football_data:/data
    networks:
      - football-scout
    profiles:
      - collector

volumes:
  football_data:
    driver: local

networks:
  football-scout:
    driver: bridge
